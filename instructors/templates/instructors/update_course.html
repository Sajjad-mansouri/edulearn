 {%extends 'profiles/instructor/base_account.html'%}
 {%load static%}
 {%block style%}
 <link rel="stylesheet" href="{% static 'css/instructors/create_course.css' %}">
 {%endblock%}
{%block main_content%}
        <main class="content-main" id="contentMain">
            <header class="page-header">
                <div class="page-header-top-row">
                    <div>
                        <h1 class="page-header-title">Create New Course</h1>
                        <p class="page-header-desc">Build your course step by step</p>
                    </div>

                </div>
            </header>

            <!-- ==================== PROGRESS STEPS ==================== -->
            <div class="progress-steps" id="progressSteps">
                <button class="progress-step completed" data-step="1"><span class="step-number"><i class="fas fa-check"></i></span><span class="step-label">Basic Info</span></button>
                <span class="step-connector completed"></span>
                <button class="progress-step active" data-step="2"><span class="step-number">2</span><span class="step-label">Curriculum</span></button>
                <span class="step-connector"></span>
                <button class="progress-step" data-step="3"><span class="step-number">3</span><span class="step-label">Outcomes</span></button>
                <span class="step-connector"></span>
                <button class="progress-step" data-step="4"><span class="step-number">4</span><span class="step-label">Prerequisites</span></button>
                <span class="step-connector"></span>
                <button class="progress-step" data-step="5"><span class="step-number">5</span><span class="step-label">Target Audience</span></button>
                <span class="step-connector"></span>
                <button class="progress-step" data-step="6"><span class="step-number">6</span><span class="step-label">Pricing</span></button>
                <span class="step-connector"></span>
                <button class="progress-step" data-step="7"><span class="step-number">7</span><span class="step-label">Media & SEO</span></button>
                <span class="step-connector"></span>
                <button class="progress-step" data-step="8"><span class="step-number">8</span><span class="step-label">Publish</span></button>
            </div>

            <!-- ==================== STEP CONTENT ==================== -->
            <div class="step-content" id="stepContent"></div>

            <!-- ==================== NAVIGATION BUTTONS ==================== -->
            <div class="step-navigation">
                <button class="nav-btn secondary" id="prevStepBtn" style="display:none;"><i class="fas fa-arrow-left"></i> Previous Step</button>
                <div class="nav-right-btns">
                    <button class="nav-btn primary" id="nextStepBtn">Next: Curriculum <i class="fas fa-arrow-right"></i></button>
                </div>
            </div>
        </main>
{%endblock%}

{%block extra_content%}
    <div class="modal-overlay" id="lessonModalOverlay" style="display:none;">
        <div class="lesson-modal-container">
            <div class="lesson-modal-header">
                <div><h3 id="modalLessonTitle">Lesson Title</h3><span class="lesson-modal-type-badge" id="modalLessonType">Video</span></div>
                <button class="modal-close" id="lessonModalClose"><i class="fas fa-times"></i></button>
            </div>
            <div class="lesson-modal-body" id="lessonContentArea"></div>
            <div class="lesson-modal-footer">
                <button class="nav-btn secondary" id="lessonModalCancel">Cancel</button>
                <button class="nav-btn primary" id="lessonModalSave"><i class="fas fa-save"></i> Save Content</button>
            </div>
        </div>
    </div>
{%endblock%}


    {%block script%}
    <script src="{%static 'js/instructors/update_course.js' %}"></script>

    {%endblock%}
