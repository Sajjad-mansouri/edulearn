<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --success: #10b981;
            --success-light: #d1fae5;
            --success-dark: #065f46;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #f0fdf4 50%, #ecfdf5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
            pointer-events: none;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: #a7f3d0;
            top: -100px;
            right: -100px;
            animation: float 6s ease-in-out infinite;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: #c7d2fe;
            bottom: -80px;
            left: -80px;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .container {
            background: var(--white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Simple green circle */
        .checkmark-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--success);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            box-shadow: 0 0 0 8px var(--success-light);
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Checkmark drawn with SVG */
        .checkmark-svg {
            width: 50px;
            height: 50px;
            stroke: var(--white);
            stroke-width: 5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .checkmark-svg path {
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: drawCheckmark 0.5s ease-out 0.3s forwards;
        }

        @keyframes drawCheckmark {
            to {
                stroke-dashoffset: 0;
            }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .message {
            font-size: 16px;
            color: var(--gray-600);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .message strong {
            color: var(--success-dark);
            font-weight: 600;
        }

        .session-info {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            margin-bottom: 28px;
            font-size: 12px;
            color: var(--gray-500);
            word-break: break-all;
        }

        .session-info span {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: var(--gray-400);
            margin-bottom: 4px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            letter-spacing: 0.2px;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--white);
            color: var(--gray-700);
            border: 1px solid var(--gray-200);
        }

        .btn-secondary:hover {
            background: var(--gray-50);
            border-color: var(--gray-400);
            transform: translateY(-2px);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% { opacity: 1; transform: translateY(-10px) rotate(0deg); }
            100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 20px;
            }

            h1 {
                font-size: 22px;
            }

            .message {
                font-size: 14px;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Success Icon - Green circle with white checkmark -->
        <div class="icon-wrapper">
            <div class="checkmark-circle">
                <svg class="checkmark-svg" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14 27 L22 35 L38 19" />
                </svg>
            </div>
        </div>

        <h1>Payment Successful!</h1>

        <p class="message">
            You are now <strong>enrolled</strong> in the course.<br>
            Start learning right away!
        </p>

        <div class="session-info" id="sessionInfo">
            <span>Session ID</span>
            <span id="sessionIdText">Loading...</span>
        </div>

        <div class="btn-group">
            <a href="/enrollment/courses/" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                Go to Courses
            </a>
            <a href="/courses/" class="btn btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
                Browse More Courses
            </a>
        </div>
    </div>

    <script>
        (function() {
            function getSessionIdFromUrl() {
                const params = new URLSearchParams(window.location.search);
                return params.get('session_id') || null;
            }

            function displaySessionId() {
                const sessionId = getSessionIdFromUrl();
                const sessionInfoEl = document.getElementById('sessionInfo');
                const sessionIdTextEl = document.getElementById('sessionIdText');

                if (sessionId) {
                    sessionIdTextEl.textContent = sessionId;
                } else {
                    sessionInfoEl.style.display = 'none';
                }

                console.log('Payment Session ID:', sessionId);
            }

            function createConfetti() {
                const colors = ['#10b981', '#4f46e5', '#f59e0b', '#ef4444', '#3b82f6', '#8b5cf6', '#ec4899', '#14b8a6'];

                for (let i = 0; i < 60; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';

                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const size = Math.random() * 8 + 4;
                    const left = Math.random() * 100;
                    const duration = Math.random() * 2 + 2;
                    const delay = Math.random() * 2;

                    confetti.style.left = left + 'vw';
                    confetti.style.width = size + 'px';
                    confetti.style.height = size * 0.4 + 'px';
                    confetti.style.background = color;
                    confetti.style.animationDuration = duration + 's';
                    confetti.style.animationDelay = delay + 's';
                    confetti.style.top = '-10px';
                    confetti.style.borderRadius = '2px';

                    document.body.appendChild(confetti);

                    setTimeout(() => {
                        confetti.remove();
                    }, (duration + delay) * 1000 + 100);
                }
            }

            document.addEventListener('DOMContentLoaded', function() {
                displaySessionId();
                createConfetti();
            });
        })();
    </script>

</body>
</html>
