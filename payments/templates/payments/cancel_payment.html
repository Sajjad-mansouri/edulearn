<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --warning-dark: #92400e;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #fef2f2 0%, #fffbeb 50%, #fef3c7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Decorative background circles */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
            pointer-events: none;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: #fde68a;
            top: -100px;
            right: -100px;
            animation: float 6s ease-in-out infinite;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: #fecaca;
            bottom: -80px;
            left: -80px;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .container {
            background: var(--white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Orange circle with X icon */
        .cancel-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--warning);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            box-shadow: 0 0 0 8px var(--warning-light);
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* X icon drawn with SVG */
        .cancel-svg {
            width: 45px;
            height: 45px;
            stroke: var(--white);
            stroke-width: 5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .cancel-svg path {
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: drawX 0.5s ease-out 0.3s forwards;
        }

        @keyframes drawX {
            to {
                stroke-dashoffset: 0;
            }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .message {
            font-size: 16px;
            color: var(--gray-600);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .message strong {
            color: var(--warning-dark);
            font-weight: 600;
        }

        .info-box {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            margin-bottom: 28px;
            font-size: 13px;
            color: var(--gray-600);
            line-height: 1.5;
        }

        .info-box svg {
            width: 16px;
            height: 16px;
            vertical-align: middle;
            margin-right: 6px;
            stroke: var(--gray-400);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            letter-spacing: 0.2px;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--white);
            color: var(--gray-700);
            border: 1px solid var(--gray-200);
        }

        .btn-secondary:hover {
            background: var(--gray-50);
            border-color: var(--gray-400);
            transform: translateY(-2px);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 20px;
            }

            h1 {
                font-size: 22px;
            }

            .message {
                font-size: 14px;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cancelled Icon - Orange circle with white X -->
        <div class="icon-wrapper">
            <div class="cancel-circle">
                <svg class="cancel-svg" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 18 L34 34" />
                    <path d="M34 18 L18 34" />
                </svg>
            </div>
        </div>

        <!-- Heading -->
        <h1>Payment Cancelled</h1>

        <!-- Message -->
        <p class="message">
            <strong>Payment was cancelled.</strong><br>
            No charges were made to your account.
        </p>

        <!-- Info Box -->
        <div class="info-box">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            You can retry the payment anytime. Your enrollment will be confirmed once payment is successful.
        </div>

        <!-- Action Buttons -->
        <div class="btn-group">
            <a href="/courses/" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a5 5 0 015 5v2M3 10l4-4m-4 4l4 4m7 6h10a5 5 0 01-5-5v-2m0 0l-4-4m4 4l4 4" />
                </svg>
                Try Again
            </a>
            <a href="/dashboard/" class="btn btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                Go to Dashboard
            </a>
        </div>
    </div>

    <script>
        (function() {
            // Parse course_id from URL if present
            function getCourseIdFromUrl() {
                const params = new URLSearchParams(window.location.search);
                return params.get('course_id') || params.get('course') || null;
            }

            // Update "Try Again" button URL to point to the specific course
            function updateTryAgainButton() {
                const courseId = getCourseIdFromUrl();
                const tryAgainBtn = document.querySelector('.btn-primary');

                if (courseId && tryAgainBtn) {
                    tryAgainBtn.href = '/courses/' + courseId + '/';
                } else if (tryAgainBtn) {
                    tryAgainBtn.href = '/courses/';
                }

                // Log for debugging
                console.log('Cancelled Course ID:', courseId);
            }

            // Initialize
            document.addEventListener('DOMContentLoaded', function() {
                updateTryAgainButton();
            });
        })();
    </script>

</body>
</html>
