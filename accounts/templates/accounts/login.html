{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | EduLearn</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" type="text/css" href="{% static 'css/accounts/login_style.css' %}">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 512'%3E%3Cpath fill='%234f46e5' d='M623.1 136.9l-282.7-98.2c-5.3-1.8-11-1.8-16.4 0L41.3 136.9C28.4 141.5 20 154.9 20 168.5s8.4 27 21.3 31.6l28.7 10v114.3c-13.8 6.6-24 19.7-24 35.3 0 13.7 8.1 25.7 19.9 31.9l.4 95.3c0 6.2 5 11.2 11.2 11.2 6.2 0 11.2-5 11.2-11.2l-.4-95.3c11.8-6.2 19.9-18.2 19.9-31.9 0-15.6-10.2-28.7-24-35.3V214.5l88.9 30.8c-4 15.5-1.6 31.4 6.7 44.7 2.4 3.8 5.3 7.4 8.6 10.7L208 440.4c0 37.7 30.9 68.3 68.3 68.3s68.3-30.6 68.3-68.3l-1.7-139.7c10.3 6.8 22.1 10.7 34.8 10.7s24.5-3.9 34.8-10.7l-1.7 139.7c0 37.7 30.9 68.3 68.3 68.3s68.3-30.6 68.3-68.3l-1.7-139.7c3.3-3.3 6.2-6.9 8.6-10.7 8.3-13.3 10.7-29.2 6.7-44.7l130.9-45.4c12.9-4.6 21.3-16 21.3-31.6s-8.4-27-21.3-31.6zM122.7 177.2l175-60.8 175 60.8v43.4l-175-60.8-175 60.8v-43.4zM276.3 403.9c-16.7 0-30.3-13.6-30.3-30.3s13.6-30.3 30.3-30.3 30.3 13.6 30.3 30.3-13.6 30.3-30.3 30.3zm137.7 0c-16.7 0-30.3-13.6-30.3-30.3s13.6-30.3 30.3-30.3 30.3 13.6 30.3 30.3-13.6 30.3-30.3 30.3z'/%3E%3C/svg%3E">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <!-- Brand Logo with Font Awesome icon -->
      <div class="brand-logo">
        <i class="fas fa-graduation-cap"></i>
        <span class="brand-name">EduLearn</span>
      </div>

      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to your account</p>

      <form id="loginForm" novalidate>
        <!-- Username input with icon -->
        <div class="input-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
          </div>
        </div>

        <!-- Password input with icon and toggle -->
        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="remember-row">
          <a href="{% url 'accounts:password_reset' %}" class="forgot-link">
            <i class="fas fa-key"></i> Forgot password?
          </a>
        </div>

        <button type="submit" class="btn" id="loginButton">
          <span class="btn-text">
            <i class="fas fa-sign-in-alt"></i> Sign In
          </span>
          <span class="spinner"></span>
        </button>

        <div class="error-message" id="errorMessage">
          <i class="fas fa-exclamation-circle"></i>
          <span id="errorText"></span>
        </div>
      </form>

      <div class="signup-link">
        Don't have an account? <a href="{% url 'accounts:register_student' %}">Sign Up</a>
      </div>
    </div>
  </div>

  <script src="{% static 'js/auth/auth.js' %}"></script>
  <script src="{% static 'js/accounts/login_script.js' %}"></script>
</body>
</html>
