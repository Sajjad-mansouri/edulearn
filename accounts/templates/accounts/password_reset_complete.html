{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Complete | Your LMS</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 512'%3E%3Cpath fill='%234f46e5' d='M623.1 136.9l-282.7-98.2c-5.3-1.8-11-1.8-16.4 0L41.3 136.9C28.4 141.5 20 154.9 20 168.5s8.4 27 21.3 31.6l28.7 10v114.3c-13.8 6.6-24 19.7-24 35.3 0 13.7 8.1 25.7 19.9 31.9l.4 95.3c0 6.2 5 11.2 11.2 11.2 6.2 0 11.2-5 11.2-11.2l-.4-95.3c11.8-6.2 19.9-18.2 19.9-31.9 0-15.6-10.2-28.7-24-35.3V214.5l88.9 30.8c-4 15.5-1.6 31.4 6.7 44.7 2.4 3.8 5.3 7.4 8.6 10.7L208 440.4c0 37.7 30.9 68.3 68.3 68.3s68.3-30.6 68.3-68.3l-1.7-139.7c10.3 6.8 22.1 10.7 34.8 10.7s24.5-3.9 34.8-10.7l-1.7 139.7c0 37.7 30.9 68.3 68.3 68.3s68.3-30.6 68.3-68.3l-1.7-139.7c3.3-3.3 6.2-6.9 8.6-10.7 8.3-13.3 10.7-29.2 6.7-44.7l130.9-45.4c12.9-4.6 21.3-16 21.3-31.6s-8.4-27-21.3-31.6zM122.7 177.2l175-60.8 175 60.8v43.4l-175-60.8-175 60.8v-43.4zM276.3 403.9c-16.7 0-30.3-13.6-30.3-30.3s13.6-30.3 30.3-30.3 30.3 13.6 30.3 30.3-13.6 30.3-30.3 30.3zm137.7 0c-16.7 0-30.3-13.6-30.3-30.3s13.6-30.3 30.3-30.3 30.3 13.6 30.3 30.3-13.6 30.3-30.3 30.3z'/%3E%3C/svg%3E">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .complete-container {
      width: 100%;
      max-width: 420px;
    }

    .complete-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .logo {
      width: 130px;
      height: auto;
      margin-bottom: 1.5rem;
    }

    /* Checkmark icon */
    .check-icon {
      display: inline-block;
      width: 64px;
      height: 64px;
      margin-bottom: 1.5rem;
      background: #f0fff4;
      border-radius: 50%;
      position: relative;
    }

    .check-icon::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -60%) rotate(45deg);
      width: 16px;
      height: 28px;
      border: solid #2f855a;
      border-width: 0 4px 4px 0;
      border-radius: 2px;
    }

    .complete-card h1 {
      font-size: 1.8rem;
      color: #2d3748;
      margin-bottom: 0.5rem;
    }

    .complete-card p {
      color: #718096;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    .btn {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.3s ease, transform 0.1s ease;
      margin-bottom: 1rem;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid #667eea;
      color: #667eea;
    }

    .btn-outline:hover {
      background: #667eea;
      color: white;
    }

    @media (max-width: 480px) {
      .complete-card {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="complete-container">
    <div class="complete-card">
      <img src="{% static 'image/logo.png' %}" alt="Logo" class="logo" onerror="this.style.display='none'">

      <div class="check-icon"></div>

      <h1>Password Reset Complete</h1>
      <p>
        Your password has been changed successfully.<br>
        You can now log in with your new password.
      </p>

      <a href="{% url 'accounts:login' %}" class="btn">Go to Login</a>
    </div>
  </div>
</body>
</html>
