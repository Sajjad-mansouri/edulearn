{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Complete | Your LMS</title>
  <link rel="icon" type="image/png" href="{% static 'images/logo/logo.png' %}">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .complete-container {
      width: 100%;
      max-width: 420px;
    }

    .complete-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .logo {
      width: 130px;
      height: auto;
      margin-bottom: 1.5rem;
    }

    /* Checkmark icon */
    .check-icon {
      display: inline-block;
      width: 64px;
      height: 64px;
      margin-bottom: 1.5rem;
      background: #f0fff4;
      border-radius: 50%;
      position: relative;
    }

    .check-icon::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -60%) rotate(45deg);
      width: 16px;
      height: 28px;
      border: solid #2f855a;
      border-width: 0 4px 4px 0;
      border-radius: 2px;
    }

    .complete-card h1 {
      font-size: 1.8rem;
      color: #2d3748;
      margin-bottom: 0.5rem;
    }

    .complete-card p {
      color: #718096;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    .btn {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.3s ease, transform 0.1s ease;
      margin-bottom: 1rem;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid #667eea;
      color: #667eea;
    }

    .btn-outline:hover {
      background: #667eea;
      color: white;
    }

    @media (max-width: 480px) {
      .complete-card {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="complete-container">
    <div class="complete-card">
      <img src="{% static 'image/logo.png' %}" alt="Logo" class="logo" onerror="this.style.display='none'">

      <div class="check-icon"></div>

      <h1>Password Reset Complete</h1>
      <p>
        Your password has been changed successfully.<br>
        You can now log in with your new password.
      </p>

      <a href="{% url 'accounts:login' %}" class="btn">Go to Login</a>
    </div>
  </div>
</body>
</html>
