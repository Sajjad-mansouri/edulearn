{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | EduLearn</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 512'%3E%3Cpath fill='%234f46e5' d='M623.1 136.9l-282.7-98.2c-5.3-1.8-11-1.8-16.4 0L41.3 136.9C28.4 141.5 20 154.9 20 168.5s8.4 27 21.3 31.6l28.7 10v114.3c-13.8 6.6-24 19.7-24 35.3 0 13.7 8.1 25.7 19.9 31.9l.4 95.3c0 6.2 5 11.2 11.2 11.2 6.2 0 11.2-5 11.2-11.2l-.4-95.3c11.8-6.2 19.9-18.2 19.9-31.9 0-15.6-10.2-28.7-24-35.3V214.5l88.9 30.8c-4 15.5-1.6 31.4 6.7 44.7 2.4 3.8 5.3 7.4 8.6 10.7L208 440.4c0 37.7 30.9 68.3 68.3 68.3s68.3-30.6 68.3-68.3l-1.7-139.7c10.3 6.8 22.1 10.7 34.8 10.7s24.5-3.9 34.8-10.7l-1.7 139.7c0 37.7 30.9 68.3 68.3 68.3s68.3-30.6 68.3-68.3l-1.7-139.7c3.3-3.3 6.2-6.9 8.6-10.7 8.3-13.3 10.7-29.2 6.7-44.7l130.9-45.4c12.9-4.6 21.3-16 21.3-31.6s-8.4-27-21.3-31.6zM122.7 177.2l175-60.8 175 60.8v43.4l-175-60.8-175 60.8v-43.4zM276.3 403.9c-16.7 0-30.3-13.6-30.3-30.3s13.6-30.3 30.3-30.3 30.3 13.6 30.3 30.3-13.6 30.3-30.3 30.3zm137.7 0c-16.7 0-30.3-13.6-30.3-30.3s13.6-30.3 30.3-30.3 30.3 13.6 30.3 30.3-13.6 30.3-30.3 30.3z'/%3E%3C/svg%3E">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
      overflow: hidden;
    }

    /* Decorative background circles */
    body::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      top: -100px;
      right: -100px;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      width: 200px;
      height: 200px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      bottom: -50px;
      left: -50px;
      pointer-events: none;
    }

    .reset-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .reset-card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 3rem 2.5rem;
      text-align: center;
      animation: fadeInUp 0.5s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Brand Logo */
    .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 2rem;
    }

    .brand-logo i {
      font-size: 3rem;
      color: #4f46e5;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-name {
      font-size: 2rem;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: -0.5px;
    }

    .reset-card h1 {
      font-size: 1.8rem;
      color: #1e293b;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .reset-card p.subtitle {
      color: #64748b;
      margin-bottom: 2.5rem;
      font-size: 1rem;
    }

    .input-group {
      position: relative;
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 1rem;
      pointer-events: none;
      transition: color 0.3s ease;
    }

    .input-wrapper input {
      width: 100%;
      padding: 0.875rem 1rem 0.875rem 2.75rem;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s ease;
      font-family: inherit;
      background: #f8fafc;
    }

    .input-wrapper input:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
      background: #ffffff;
    }

    .input-wrapper input:focus ~ .input-icon {
      color: #4f46e5;
    }

    .input-wrapper input::placeholder {
      color: #a0aec0;
    }

    .btn {
      width: 100%;
      padding: 0.875rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      font-family: inherit;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 5px 15px rgba(79, 70, 229, 0.2);
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-text {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-outline {
      background: transparent;
      border: 2px solid #4f46e5;
      color: #4f46e5;
    }

    .btn-outline:hover {
      background: #4f46e5;
      color: white;
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.2);
    }

    .error-message, .success-message {
      margin-top: 1rem;
      padding: 0.875rem;
      border-radius: 12px;
      font-size: 0.9rem;
      display: none;
      align-items: center;
      gap: 8px;
      text-align: left;
    }

    .error-message {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .success-message {
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
    }

    .error-message i, .success-message i {
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .show {
      display: flex;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn.loading .btn-text { display: none; }
    .btn.loading .spinner { display: inline-block; }

    .form-footer {
      font-size: 0.9rem;
      color: #64748b;
      margin-top: 1.5rem;
    }

    .form-footer a {
      color: #4f46e5;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }

    .form-footer a:hover {
      color: #4338ca;
      text-decoration: underline;
    }

    .hidden {
      display: none !important;
    }

    /* Success icon */
    .success-icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      color: #10b981;
      animation: bounceIn 0.6s ease;
    }

    @keyframes bounceIn {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      50% {
        transform: scale(1.2);
      }
      70% {
        transform: scale(0.9);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @media (max-width: 480px) {
      .reset-card {
        padding: 2rem 1.5rem;
      }

      .brand-logo i {
        font-size: 2.5rem;
      }

      .brand-name {
        font-size: 1.5rem;
      }

      .reset-card h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="reset-container">
    <!-- Password Reset Form Card -->
    <div class="reset-card" id="resetCard">
      <!-- Brand Logo with Font Awesome icon -->
      <div class="brand-logo">
        <i class="fas fa-graduation-cap"></i>
        <span class="brand-name">EduLearn</span>
      </div>

      <h1>Reset Password</h1>
      <p class="subtitle">Enter your email to receive a reset link</p>

      <form id="resetForm" novalidate>
        <div class="input-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
          </div>
        </div>

        <button type="submit" class="btn" id="resetButton">
          <span class="btn-text">
            <i class="fas fa-paper-plane"></i> Send Reset Link
          </span>
          <span class="spinner"></span>
        </button>

        <div class="error-message" id="errorMessage">
          <i class="fas fa-exclamation-circle"></i>
          <span id="errorText"></span>
        </div>
      </form>

      <div class="form-footer">
        Remember your password? <a href="{% url 'accounts:login' %}">Sign In</a>
      </div>
    </div>

    <!-- Success Message Card (hidden initially) -->
    <div class="reset-card hidden" id="successCard">
      <div class="success-icon">
        <i class="fas fa-envelope-open-text"></i>
      </div>
      <h1>Check Your Email</h1>
      <p class="subtitle">
        If an account exists with that email, we've sent a password reset link.<br>
        Please follow the instructions in the email.
      </p>
      <a href="/login/" class="btn btn-outline" style="text-decoration: none;">
        <i class="fas fa-sign-in-alt"></i> Go to Login
      </a>
    </div>
  </div>

  <script src="{% static 'js/auth/auth.js' %}"></script>

  <script type="module">
    const resetCard = document.getElementById('resetCard');
    const successCard = document.getElementById('successCard');
    const resetForm = document.getElementById('resetForm');
    const errorDiv = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const resetButton = document.getElementById('resetButton');

    function showError(message) {
      errorText.textContent = message;
      errorDiv.classList.add('show');
    }

    function hideError() {
      errorText.textContent = '';
      errorDiv.classList.remove('show');
    }

    function setLoading(isLoading) {
      if (isLoading) {
        resetButton.classList.add('loading');
        resetButton.disabled = true;
      } else {
        resetButton.classList.remove('loading');
        resetButton.disabled = false;
      }
    }

    async function sendResetEmail(email) {
      // Use Auth to build the base URL, then append the password reset path
      const auth = new Auth({
        baseURL: window.location.origin + '/api/v1/accounts',
      });
      const url = `${auth.baseURL}/password_reset/`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email }),
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          let errorMsg = '';
          if (typeof errorData === 'string') {
            errorMsg = errorData;
          } else if (errorData.detail) {
            errorMsg = errorData.detail;
          } else {
            const messages = [];
            for (const [key, value] of Object.entries(errorData)) {
              if (Array.isArray(value)) {
                messages.push(...value);
              } else {
                messages.push(value);
              }
            }
            errorMsg = messages.join(' ') || 'Failed to send reset email.';
          }
          return { success: false, error: errorMsg };
        }

        return { success: true };
      } catch (err) {
        return { success: false, error: 'Network error. Please try again.' };
      }
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email = document.getElementById('email').value.trim();

      if (!email) {
        showError('Please enter your email address.');
        return;
      }

      setLoading(true);

      const result = await sendResetEmail(email);

      if (result.success) {
        resetCard.classList.add('hidden');
        successCard.classList.remove('hidden');
      } else {
        showError(result.error);
      }

      setLoading(false);
    });
  </script>
</body>
</html>
