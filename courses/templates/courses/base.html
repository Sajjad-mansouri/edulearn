<body>
    <!-- ==================== PUBLIC NAVIGATION ==================== -->
    <nav class="top-nav public-nav" id="topNav">
        <div class="top-nav-container">
            <div class="top-nav-left">
                <a href="{%url 'landing_page:main'%}" class="brand-logo">
                    <span class="brand-icon"><i class="fas fa-graduation-cap"></i></span>
                    <span class="brand-text">EduLearn</span>
                </a>
                <a href="/courses" class="nav-link active">Courses</a>


            </div>
            <div class="top-nav-center">
                <div class="global-search">
                    <i class="fas fa-search search-prefix"></i>
                    <input type="text" id="catalogSearch" class="global-search-input" placeholder="Search 10,000+ courses...">
                </div>
            </div>
            <div class="top-nav-right">
                <a href="{%url 'accounts:register_instructor'%}" class="nav-link teach-link">
                    <i class="fas fa-chalkboard-user"></i> Teach on EduLearn
                </a>
                <a href="/login" class="btn-login">Log In</a>
                <a href="/register" class="btn-signup">Sign Up</a>
            </div>
        </div>
    </nav>



    <!-- ==================== CATALOG LAYOUT ==================== -->
    {%block main_content%}
    {%endblock%}

    <!-- ==================== FOOTER ==================== -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-grid">


                <div class="footer-column">
                    <h4>Connect</h4>
                    <div class="footer-social-icons">
                        <a href="#"><i class="fab fa-facebook-f"></i></a>
                        <a href="#"><i class="fab fa-twitter"></i></a>
                        <a href="#"><i class="fab fa-linkedin-in"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom"><p>&copy; 2026 EduLearn. All rights reserved.</p></div>
        </div>
    </footer>

    <script src="{%static 'js/auth/auth.js' %}"></script>
    {%block script%}
    {%endblock%}
